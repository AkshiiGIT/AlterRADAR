name: Build et publier AlterRADAR
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: dist:win
            artifact: AlterRADAR-Windows
          - os: macos-latest
            build: dist:mac
            artifact: AlterRADAR-macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Pas de certificat : macOS reçoit une signature « ad hoc » (mac.identity = "-"),
      # Windows reste non signé. Voir docs/PUBLICATION_GITHUB.md.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Vérifier le runtime Node 24
        shell: bash
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Vérifier le verrouillage des dépendances
        run: npm run check:lock
      - name: Tests
        run: npm test
      - name: Tests des formats DOCX, PDF et e-mail
        run: npm run smoke:deps
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Audit d'Electron (moteur livré dans l'application)
        run: npm run audit:electron
      - name: Générer les installateurs
        run: npm run ${{ matrix.build }}

      # Lance chaque application construite en mode --self-test : génération DOCX/PDF,
      # lecture PDF, brouillon e-mail, icône et affichage de l'interface (données temporaires).
      - name: Autotest de l'application Windows (x64)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $report = Join-Path $PWD 'selftest-windows-x64.json'
          $exe = Join-Path $PWD 'release\win-unpacked\AlterRADAR.exe'
          if (-not (Test-Path $exe)) { Write-Error "Application introuvable : $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$report" -PassThru
          $null = $p.Handle
          # 4 minutes maximum : en cas de blocage, le rapport indique l'étape en cours (« running »).
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; if (Test-Path $report) { Get-Content $report }; Write-Error 'Autotest Windows bloqué (4 min)'; exit 1 }
          if (Test-Path $report) { Get-Content $report } else { Write-Error 'Aucun rapport produit' }
          if ($p.ExitCode -ne 0) { Write-Error "Autotest Windows en échec (code $($p.ExitCode))"; exit 1 }
      - name: Autotest des applications macOS (arm64 et x64)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            found=1
            bin="$app/Contents/MacOS/AlterRADAR"
            archs="$(lipo -archs "$bin")"
            report="$PWD/selftest-macos-$(echo "$archs" | tr ' ' '-').json"
            codesign --verify --deep --strict "$app"
            if [[ "$archs" == *x86_64* && "$(uname -m)" == arm64 ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "Rosetta indisponible : autotest x64 ignoré pour $app"; continue
            fi
            echo "Autotest $app ($archs)"
            # --use-mock-keychain : sans signature Apple, l'accès au trousseau ouvre une fenêtre
            # de confirmation qui bloquerait la CI. 4 minutes maximum par application.
            if ! perl -e 'alarm shift; exec @ARGV' 240 "$bin" --use-mock-keychain --self-test="$report" < /dev/null; then
              echo "Autotest en échec ou bloqué (étape en cours : champ \"running\") :"
              cat "$report" 2>/dev/null || echo "Aucun rapport produit"
              exit 1
            fi
            cat "$report"
          done < <(find release -maxdepth 2 -name 'AlterRADAR.app' -type d)
          test "$found" = 1

      - name: Stocker les installateurs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les installateurs Windows et Mac
        uses: actions/download-artifact@v7
        with:
          pattern: AlterRADAR-*
          path: release
          merge-multiple: true
      - name: Contrôler les fichiers récupérés
        run: |
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f -name '*-Setup.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*-Portable.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
      - name: Calculer SHA-256
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publier la release du dépôt public
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          # Publication MANUELLE après tests réels : une release brouillon
          # évite de diffuser automatiquement des builds non vérifiés.
