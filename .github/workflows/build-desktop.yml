name: Build et publier AlterRADAR
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: dist:win
            artifact: AlterRADAR-Windows
          - os: macos-latest
            build: dist:mac
            artifact: AlterRADAR-macOS
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Générer les installateurs
        run: npm run ${{ matrix.build }} -- --publish never
      - name: Stocker les installateurs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les installateurs Windows et Mac
        uses: actions/download-artifact@v4
        with:
          pattern: AlterRADAR-*
          path: release
          merge-multiple: true
      - name: Contrôler les fichiers récupérés
        run: |
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
      - name: Calculer SHA-256
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publier la release du dépôt public
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          # Publication MANUELLE après tests réels et signatures : une release brouillon
          # évite de diffuser automatiquement des builds non vérifiés.
